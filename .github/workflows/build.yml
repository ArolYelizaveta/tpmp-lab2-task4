name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build
        run: make
      - name: Run test
        run: |
          ./book_filter data/input.txt data/output.txt
          echo "Filtered books:"
          cat data/output.txt
